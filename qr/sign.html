  .bridge { position: absolute; bottom: 0; left: 0; width: 100%; aspect-ratio: 1000/140; }
  .bridge .tower, .bridge .deck { fill: #c0362c; }
  .bridge .cable, .bridge .hangers { fill: none; stroke: #c0362c; }
  .bridge .cable { stroke-width: 2.5; } .bridge .hangers { stroke-width: .8; opacity: .8; }
  .bridge .water { fill: #0b1a3a; opacity: .85; }
