<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120a24">
  <title>Request a Song</title>
  <link rel="icon" href="favicon.svg?v=20261030135925" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png?v=20261030135925" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20261030135925">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20261030135925">
</head>
<body>
  <!-- The theme's icon (a jet, a music note…). theme.js fills in the shape. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="icon" viewBox="0 0 24 24"><path d=""/></symbol>
  </svg>

  <!-- Background scene, filled in by theme.js. -->
  <div class="scene" aria-hidden="true"></div>

  <svg class="launch-icon" aria-hidden="true"><use href="#icon"/></svg>

  <main>
    <header class="brand">
      <p class="eyebrow" data-text="eyebrow"></p>
      <h1><span data-text="heading"></span> <span class="accent" data-text="headingAccent"></span></h1>
      <p class="lede" data-text="lede"></p>
    </header>

    <section id="guest" class="ticket">
      <div class="ticket-head">
        <span id="pass-type"></span>
        <span class="route"><span data-text="routeFrom"></span> <svg class="mini-icon"><use href="#icon"/></svg> <span data-text="routeTo"></span></span>
      </div>

      <p id="closed-banner" class="closed-banner" hidden>
        <strong data-text="closedTitle"></strong> <span data-text="closedBody"></span>
      </p>

      <form id="request-form" autocomplete="off">
        <label>
          <span class="field-label"><span data-text="urlLabel"></span> <small data-text="urlHint"></small></span>
          <input id="url" type="text" inputmode="url" autocapitalize="off" spellcheck="false"
                 placeholder="https://music.apple.com/…" required>
        </label>
        <label>
          <span class="field-label"><span data-text="nameLabel"></span> <small data-text="nameHint"></small></span>
          <input id="requester" type="text" data-placeholder="namePlaceholder" maxlength="40">
        </label>
        <button id="submit" type="submit"></button>
      </form>

      <div class="perforation"></div>

      <div id="tracker" class="tracker" data-step="0" hidden>
        <div class="track"><svg class="track-icon"><use href="#icon"/></svg></div>
        <ol class="stops">
          <li></li>
          <li></li>
          <li></li>
        </ol>
      </div>
      <p id="status" class="status" role="status"></p>
    </section>

    <section id="admin" class="admin-panel" hidden>
      <div class="admin-head">
        <h2 data-text="adminTitle"></h2>
        <button id="admin-exit" class="link" type="button">← Back</button>
      </div>

      <div id="admin-auth">
        <button id="sign-in" type="button">Sign in with Google</button>
      </div>
      <p id="admin-msg" class="admin-msg"></p>

      <div id="admin-controls" hidden>
        <div class="switch" data-open="true">
          <div>
            <span class="switch-label" data-text="switchLabel"></span>
            <span id="switch-state" class="switch-state"></span>
          </div>
          <button id="toggle" type="button"></button>
        </div>

        <label class="theme-picker">
          <span class="switch-label">Theme</span>
          <select id="theme-select"></select>
        </label>

        <h3 data-text="boardTitle"></h3>
        <div class="board-wrap">
          <table class="board">
            <thead><tr><th>Time</th><th>Name</th><th>Status</th><th>Track</th></tr></thead>
            <tbody id="board"></tbody>
          </table>
        </div>
      </div>

      <button id="sign-out" class="link" type="button" hidden>Sign out</button>
    </section>
  </main>

  <!-- theme.js runs first so the page is themed before Firebase finishes loading. -->
  <script type="module" src="theme.js?v=20261030135925"></script>
  <script type="module" src="app.js?v=20261030135925"></script>
</body>
</html>
